name: Update today schedule cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0,15,30,45 * * * *'

permissions:
  contents: write

jobs:
  update-today-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update today schedule cache
        run: node scripts/update-today-cache.js

      - name: Commit cache update
        run: |
          if git diff --quiet -- data/today.json; then
            echo "No cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git commit -m "Update today schedule cache"
          git push
